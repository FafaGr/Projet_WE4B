<div class="container py-5">
    <div class="row mb-4">
        <div class="col" *ngIf="currentUser$ | async as user">
            <h2 class="fw-bold text-white">Tableau de bord administrateur</h2>
            <p class="text-secondary">Bienvenue, {{ user.nom }}. Gérez votre catalogue ici.</p>
        </div>
    </div>
    <div class="row g-4">
        <div class="col-md-6 col-lg-4">
            <div class="card bg-dark border-secondary h-100 p-4">
                <div class="bg-danger text-white rounded p-3 d-inline-block mb-3 align-self-start">
                    <i class="fas fa-plus-circle fa-2x"></i>
                </div>
                <h4 class="text-white">Gestion du Catalogue</h4>
                <p class="text-secondary">Ajouter, modifier ou supprimer des jeux.</p>
                <div class="mt-auto">
                    <a routerLink="/admin/games" class="btn btn-danger w-100">Gérer les jeux</a>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-lg-4">
            <div class="card bg-dark border-secondary h-100 p-4">
                <div class="bg-primary text-white rounded p-3 d-inline-block mb-3 align-self-start">
                    <i class="fas fa-history fa-2x"></i>
                </div>
                <h4 class="text-white">Historique Commandes</h4>
                <p class="text-secondary">Consultez les ventes et les clients.</p>
                <div class="mt-auto">
                    <a routerLink="/admin/commandes" class="btn btn-primary w-100">Voir les ventes</a>
                </div>
            </div>
        </div>
    </div>
</div>
