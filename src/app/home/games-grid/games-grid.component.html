<section id="games">

  <div class="row g-4" *ngIf="jeux && jeux.length > 0; else noGames">

    <div class="col-6 col-md-4 col-lg-3" *ngFor="let jeu of jeux">
      <div class="game-card h-100 bg-dark">

        <a [routerLink]="['/game-detail', jeu.id_jeu]" class="game-link text-decoration-none text-reset">
          <div class="game-image-wrapper position-relative overflow-hidden">
            <img
              [src]="jeu.image_url"
              class="card-img-top"
              [alt]="jeu.titre"
            >

            <div *ngIf="jeu.stock && jeu.stock > 0 && jeu.stock < 5"
                 class="badge bg-warning text-white position-absolute top-3 end-0 m-2">
              Stock limité
            </div>

            <div *ngIf="jeu.nouveau" class="badge badge-new position-absolute top-0 end-0 m-2">
              Nouveau
            </div>
          </div>
        </a>

        <div class="card-body d-flex flex-column">
          <a [routerLink]="['/game-detail', jeu.id_jeu]" class="game-link text-decoration-none text-reset">
            <h5 class="card-title text-white">{{ jeu.titre }}</h5>
          </a>

          <p class="text-white small mb-2">
            {{ jeu.categories_noms || 'Action/RPG' }}
          </p>


          <div class="mt-auto">
            <div class="price-section mb-3">
              <span class="h4 text-danger fw-bold">{{ jeu.prix | number:'1.2-2' }}€</span>

              <span class="text-white small ms-2" *ngIf="jeu.ancien_prix">
                <del>{{ jeu.ancien_prix | number:'1.2-2' }}€</del>
              </span>

            </div>

            <button class="btn btn-danger w-100 btn-sm" (click)="addToCart(jeu)">
              <i class="fas fa-shopping-cart"></i> Ajouter
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <ng-template #noGames>
    <div class="col-12 text-center py-5">
      <p class="text-secondary fst-italic">Aucun jeu n'a été trouvé dans la boutique.</p>
    </div>
  </ng-template>

  <nav class="mt-5" aria-label="Page navigation">
    <ul class="pagination justify-content-center">
      <li class="page-item">
        <a class="page-link bg-secondary border-0 text-white" style="cursor: pointer;" (click)="changePage(-1)">Précédent</a>
      </li>
      <li class="page-item active">
        <a class="page-link bg-danger border-0" style="cursor: pointer;" (click)="changePage(1)">1</a>
      </li>
      <li class="page-item">
        <a class="page-link bg-secondary border-0 text-white" style="cursor: pointer;" (click)="changePage(2)">2</a>
      </li>
      <li class="page-item">
        <a class="page-link bg-secondary border-0 text-white" style="cursor: pointer;" (click)="changePage(0)">Suivant</a>
      </li>
    </ul>
  </nav>
</section>
